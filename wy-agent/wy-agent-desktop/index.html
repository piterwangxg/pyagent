<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>WY Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">W</div>
          <div class="brand-text">
            <strong>WY Agent</strong>
            <span>Desktop</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item is-active" data-view="chat">
            <span class="nav-icon">◍</span>
            对话
          </button>
          <button class="nav-item" data-view="models">
            <span class="nav-icon">◎</span>
            模型配置
          </button>
        </nav>

        <div class="sidebar-foot">
          <span class="dot" id="healthDot"></span>
          <div class="health-text">
            <span id="healthText">检测中…</span>
            <span class="health-sub" id="healthSub"></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-text">
            <h1 id="viewTitle">对话</h1>
            <p class="sub" id="viewSub">与 Agent 交互</p>
          </div>
          <div class="active-chip" id="activeChip" hidden>
            <span class="chip-label">当前模型</span>
            <span id="activeChipText">—</span>
          </div>
        </header>

        <section class="view is-active" id="view-chat">
          <div class="chat-log" id="chatLog">
            <div class="empty-state">
              <div class="empty-icon">◍</div>
              <p>还没有对话</p>
              <span>先在「模型配置」里添加并启用一个模型，再回来试试</span>
            </div>
          </div>

          <form class="composer" id="chatForm">
            <textarea
              id="chatInput"
              rows="1"
              placeholder="输入消息，Enter 发送，Shift + Enter 换行"
            ></textarea>
            <button type="submit" class="btn btn-primary" id="sendBtn">发送</button>
          </form>
        </section>

        <section class="view" id="view-models">
          <div class="toolbar">
            <p class="toolbar-text">
              配置保存在后端 SQLite（<code>wy-agent-server/data/app.db</code>），
              API Key 入库后仅以掩码形式返回。
            </p>
            <button class="btn btn-primary" id="newModelBtn">+ 新建配置</button>
          </div>

          <div class="card-grid" id="modelGrid"></div>
        </section>
      </main>
    </div>

    <div class="drawer-mask" id="drawerMask" hidden></div>

    <aside class="drawer" id="drawer" hidden>
      <header class="drawer-head">
        <h2 id="drawerTitle">新建模型配置</h2>
        <button type="button" class="icon-btn" id="drawerClose" aria-label="关闭">✕</button>
      </header>

      <form class="form" id="modelForm">
        <label class="field">
          <span class="label">配置名称 <em>*</em></span>
          <input id="f-name" type="text" maxlength="64" placeholder="例如 DeepSeek 主力" required />
        </label>

        <label class="field">
          <span class="label">服务商</span>
          <select id="f-provider"></select>
        </label>

        <label class="field">
          <span class="label">Base URL</span>
          <input id="f-baseUrl" type="text" placeholder="https://api.deepseek.com/v1" />
        </label>

        <label class="field">
          <span class="label">API Key</span>
          <input id="f-apiKey" type="password" autocomplete="off" placeholder="sk-..." />
          <span class="hint" id="keyHint" hidden>留空则保持原密钥不变</span>
        </label>

        <label class="field">
          <span class="label">模型名</span>
          <input id="f-model" type="text" placeholder="deepseek-chat" />
        </label>

        <div class="field-row">
          <label class="field">
            <span class="label">温度 <span class="mono" id="f-tempVal">0.7</span></span>
            <input id="f-temp" type="range" min="0" max="2" step="0.1" value="0.7" />
          </label>

          <label class="field">
            <span class="label">最大 Tokens</span>
            <input id="f-maxTokens" type="number" min="1" max="200000" value="2048" />
          </label>
        </div>

        <footer class="drawer-foot">
          <button type="button" class="btn" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
        </footer>
      </form>
    </aside>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="renderer.js"></script>
  </body>
</html>
